# Installed system: boot slot a or b. A new slot is tried exactly once: try_slot
# is erased before booting it, and the OS only makes it permanent (slot=) after
# it has run. If it dies, the next boot goes back to the old slot.
# boot_fails counts starts of the current slot that never got going (KleinOS sets
# it back to 0 once it is up). After 3 failed starts in a row it opens Recovery.
# Installed systems get this file from their updates too (kernel/sys/update.cpp).
insmod all_video
set gfxpayload=keep
set slot=a
set try_slot=
set boot_fails=0
load_env -f /boot/grubenv slot try_slot boot_fails
set boot_slot=$slot
set recovery=
if [ -n "$try_slot" ]; then
  set boot_slot=$try_slot
  set try_slot=
  save_env -f /boot/grubenv try_slot
elif [ "$boot_fails" = "0" ]; then
  set boot_fails=1
  save_env -f /boot/grubenv boot_fails
elif [ "$boot_fails" = "1" ]; then
  set boot_fails=2
  save_env -f /boot/grubenv boot_fails
elif [ "$boot_fails" = "2" ]; then
  set boot_fails=3
  save_env -f /boot/grubenv boot_fails
else
  set recovery=recovery=1
fi
multiboot2 /boot/kernel_$boot_slot.elf mode=installed slot=$boot_slot $recovery
module2 /boot/initrd_$boot_slot.tar initrd
boot
