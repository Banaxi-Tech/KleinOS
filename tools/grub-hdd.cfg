# Installed system: boot slot a or b. A new slot is tried exactly once: try_slot
# is erased before booting it, and the OS only makes it permanent (slot=) after
# it has run. If it dies, the next boot goes back to the old slot.
insmod all_video
set gfxpayload=keep
set slot=a
set try_slot=
load_env -f /boot/grubenv slot try_slot
set boot_slot=$slot
if [ -n "$try_slot" ]; then
  set boot_slot=$try_slot
  set try_slot=
  save_env -f /boot/grubenv try_slot
fi
multiboot2 /boot/kernel_$boot_slot.elf mode=installed slot=$boot_slot
module2 /boot/initrd_$boot_slot.tar initrd
boot
