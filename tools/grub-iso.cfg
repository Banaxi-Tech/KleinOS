set timeout=5
set default=0
insmod all_video
insmod gfxterm
set gfxmode=1280x800x32,auto
terminal_output gfxterm
set gfxpayload=keep
set menu_color_normal=white/blue
set menu_color_highlight=black/light-gray
set color_normal=white/blue

menuentry "Install KleinOS" {
  echo "Loading KleinOS Setup..."
  multiboot2 /boot/kernel.elf mode=installer
  module2 /boot/initrd.tar initrd
  module2 /boot/system.img system.img
  boot
}

menuentry "Try KleinOS without installing" {
  multiboot2 /boot/kernel.elf mode=live
  module2 /boot/initrd.tar initrd
  boot
}
